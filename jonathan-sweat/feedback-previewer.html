<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feedback Previewer · Jonathan Sweat</title>
<style>
  :root{
    --ink:#0a2540; --gold:#c9a352; --burgundy:#6e2229;
    --cream:#f8f3eb; --line:#dfe3ea; --slate:#5a6373; --paper:#fff;
    --bar:56px; --side:340px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#eef1f5;overflow:hidden}

  /* ===== Top bar ===== */
  .bar{height:var(--bar);background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:10}
  .bar__brand{font-weight:700;letter-spacing:.02em;font-size:15px;white-space:nowrap}
  .bar__brand small{display:block;font-weight:400;font-size:11px;color:rgba(255,255,255,.6);letter-spacing:.04em}
  select{font:inherit;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:#142e4f;color:#fff;cursor:pointer;max-width:230px}
  .spacer{flex:1}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
  .btn--toggle{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
  .btn--toggle.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .btn--ghost{background:transparent;color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.25)}
  .btn--ghost:hover{background:rgba(255,255,255,.1)}
  .btn--gold{background:var(--gold);color:var(--ink)}
  .btn--gold:hover{background:#e6cf91}
  .count{font-size:12px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);padding:5px 10px;border-radius:20px}

  /* ===== Layout ===== */
  .stage{position:fixed;top:var(--bar);left:0;right:var(--side);bottom:0;background:#dde2e9}
  .stage iframe{width:100%;height:100%;border:0;background:#fff}
  .stage.commenting iframe{cursor:crosshair}
  .hint{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5;display:none}
  .stage.commenting .hint{display:block}

  /* ===== Sidebar ===== */
  .side{position:fixed;top:var(--bar);right:0;bottom:0;width:var(--side);background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column}
  .side__head{padding:16px 18px;border-bottom:1px solid var(--line)}
  .side__head h2{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
  .side__head p{font-size:12.5px;color:var(--slate);margin-top:4px;line-height:1.5}
  .list{flex:1;overflow-y:auto;padding:12px}
  .empty{color:var(--slate);font-size:13px;text-align:center;padding:40px 20px;line-height:1.6}
  .cmt{border:1px solid var(--line);border-radius:8px;padding:12px 12px 12px 40px;margin-bottom:10px;position:relative;background:#fff;transition:border-color .15s,box-shadow .15s}
  .cmt:hover{border-color:var(--gold);box-shadow:0 2px 10px rgba(10,37,64,.06)}
  .cmt__num{position:absolute;left:10px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--burgundy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .cmt__ctx{font-size:11px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;word-break:break-word}
  .cmt textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.5;border:0;resize:vertical;min-height:42px;color:var(--ink);outline:none;background:transparent}
  .cmt__actions{display:flex;gap:10px;margin-top:8px}
  .cmt__actions button{font:inherit;font-size:11.5px;background:none;border:0;color:var(--slate);cursor:pointer;padding:0}
  .cmt__actions button:hover{color:var(--burgundy)}
  .cmt__actions .jump{color:var(--ink);font-weight:600}
  .side__foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
  .side__foot .btn{flex:1;text-align:center}
  .btn--export{background:var(--ink);color:#fff}
  .btn--export:hover{background:#142e4f}
  .btn--clear{background:#fff;color:var(--burgundy);border-color:var(--line)}
  .btn--clear:hover{border-color:var(--burgundy)}

  /* ===== Export modal ===== */
  .modal{position:fixed;inset:0;background:rgba(10,37,64,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
  .modal.open{display:flex}
  .modal__panel{background:#fff;border-radius:10px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .modal__head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal__head h3{font-size:16px}
  .modal textarea{flex:1;border:0;padding:18px 20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6;resize:none;color:var(--ink);outline:none;min-height:340px}
  .modal__foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  @media(max-width:900px){:root{--side:280px}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar__brand">Feedback Previewer<small>Jonathan Sweat · The Legacy Team</small></div>
  <select id="pageSel" aria-label="Choose page"></select>
  <button class="btn btn--toggle" id="toggleBtn">Comment Mode: Off</button>
  <span class="count" id="count">0 comments</span>
  <div class="spacer"></div>
  <a class="btn btn--ghost" id="openTab" target="_blank" rel="noopener">Open page in tab</a>
  <button class="btn btn--gold" id="exportBtn">Export Feedback</button>
</div>

<div class="stage" id="stage">
  <div class="hint">Comment mode on. Click anywhere on the page to drop a pin.</div>
  <iframe id="frame" title="Preview"></iframe>
</div>

<aside class="side">
  <div class="side__head">
    <h2 id="sideTitle">Comments</h2>
    <p id="sideSub">Toggle Comment Mode, then click on the page to leave feedback. Comments save in this browser automatically.</p>
  </div>
  <div class="list" id="list"></div>
  <div class="side__foot">
    <button class="btn btn--export" id="exportBtn2">Export all</button>
    <button class="btn btn--clear" id="clearBtn">Clear page</button>
  </div>
</aside>

<div class="modal" id="modal">
  <div class="modal__panel">
    <div class="modal__head">
      <h3>Feedback export (Markdown)</h3>
      <button class="btn btn--ghost" id="modalClose" style="color:var(--ink);border-color:var(--line)">Close</button>
    </div>
    <textarea id="exportText" readonly></textarea>
    <div class="modal__foot">
      <button class="btn btn--clear" id="downloadBtn">Download .md</button>
      <button class="btn btn--gold" id="copyBtn">Copy to clipboard</button>
    </div>
  </div>
</div>

<script>
(function(){
  var PAGES = [
    ['01-home.html','01 · Home'],
    ['02-about.html','02 · About'],
    ['03-loan-programs.html','03 · Loan Programs'],
    ['04-pre-approval-difference.html','04 · Pre-Approval Difference'],
    ['05-apply.html','05 · Apply / Get Started'],
    ['06-testimonials.html','06 · Reviews'],
    ['07-for-realtors.html','07 · For Realtors'],
    ['08-faq-contact.html','08 · FAQ + Contact'],
    ['09-blog.html','09 · Blog']
  ];
  var KEY = 'jsweat-feedback-v1';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ state = {}; }

  var commenting = false;
  var current = PAGES[0][0];

  var frame = document.getElementById('frame');
  var stage = document.getElementById('stage');
  var pageSel = document.getElementById('pageSel');
  var toggleBtn = document.getElementById('toggleBtn');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var sideTitle = document.getElementById('sideTitle');
  var openTab = document.getElementById('openTab');

  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function pageComments(p){ return state[p] || (state[p] = []); }
  function uid(){ return 'c' + Math.floor(performance.now()*1000) + '' + listEl.childElementCount; }
  function label(p){ for(var i=0;i<PAGES.length;i++){ if(PAGES[i][0]===p) return PAGES[i][1]; } return p; }

  // Build page dropdown
  PAGES.forEach(function(pg){
    var o = document.createElement('option'); o.value = pg[0]; o.textContent = pg[1]; pageSel.appendChild(o);
  });

  function totalCount(){ var n=0; for(var k in state){ n += (state[k]||[]).length; } return n; }
  function refreshCount(){
    var here = pageComments(current).length;
    countEl.textContent = here + ' on page · ' + totalCount() + ' total';
  }

  function loadPage(p){
    current = p;
    pageSel.value = p;
    openTab.href = p;
    sideTitle.textContent = label(p);
    frame.src = p;
  }

  frame.addEventListener('load', function(){
    var doc;
    try { doc = frame.contentDocument; } catch(e){ doc = null; }
    if(!doc){ return; }
    injectStyle(doc);
    bindFrame(doc);
    renderPins(doc);
    renderList();
    refreshCount();
  });

  function injectStyle(doc){
    if(doc.getElementById('__fbstyle')) return;
    var s = doc.createElement('style'); s.id='__fbstyle';
    s.textContent = '.__fbpin{position:absolute;z-index:99999;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#6e2229;color:#fff;font:700 13px/26px -apple-system,sans-serif;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff}.__fbpin:hover{background:#c9a352;color:#0a2540}';
    (doc.head||doc.documentElement).appendChild(s);
  }

  function ctxHint(el){
    if(!el) return '';
    // climb to a meaningful ancestor with text
    var node = el, hops=0;
    while(node && hops < 4){
      if(node.tagName && /^H[1-4]$/.test(node.tagName)){ return trim(node.textContent); }
      node = node.parentElement; hops++;
    }
    // nearest heading above within section
    var sec = el.closest ? (el.closest('section,header,footer,article,div')) : null;
    if(sec){ var h = sec.querySelector('h1,h2,h3,h4'); if(h) return trim(h.textContent); }
    return trim(el.textContent) || (el.tagName ? el.tagName.toLowerCase() : '');
  }
  function trim(s){ s=(s||'').replace(/\s+/g,' ').trim(); return s.length>54 ? s.slice(0,54)+'…' : s; }

  function bindFrame(doc){
    doc.addEventListener('click', function(e){
      if(!commenting) return;
      // suppress navigation / page interactions while annotating
      e.preventDefault(); e.stopPropagation();
      var x = e.pageX, y = e.pageY;
      var c = { id: uid(), x: x, y: y, ctx: ctxHint(e.target), text: '' };
      pageComments(current).push(c);
      save(); renderPins(doc); renderList(true, c.id); refreshCount();
    }, true);
  }

  function renderPins(doc){
    doc.querySelectorAll('.__fbpin').forEach(function(p){ p.remove(); });
    pageComments(current).forEach(function(c, i){
      var pin = doc.createElement('div');
      pin.className = '__fbpin'; pin.textContent = (i+1);
      pin.style.left = c.x + 'px'; pin.style.top = c.y + 'px';
      pin.setAttribute('data-id', c.id);
      pin.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        var row = document.querySelector('.cmt[data-id="'+c.id+'"]');
        if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); var ta=row.querySelector('textarea'); if(ta) ta.focus(); }
      });
      doc.body.appendChild(pin);
    });
  }

  function renderList(focusNew, focusId){
    var arr = pageComments(current);
    listEl.innerHTML = '';
    if(!arr.length){
      var e = document.createElement('div'); e.className='empty';
      e.innerHTML = 'No comments on this page yet.<br>Turn on Comment Mode and click the page to add one.';
      listEl.appendChild(e);
      return;
    }
    arr.forEach(function(c, i){
      var row = document.createElement('div'); row.className='cmt'; row.setAttribute('data-id', c.id);
      row.innerHTML =
        '<div class="cmt__num">'+(i+1)+'</div>'+
        (c.ctx ? '<div class="cmt__ctx">'+escapeHtml(c.ctx)+'</div>' : '')+
        '<textarea placeholder="Type your feedback...">'+escapeHtml(c.text)+'</textarea>'+
        '<div class="cmt__actions"><button class="jump">Jump to pin</button><button class="del">Delete</button></div>';
      var ta = row.querySelector('textarea');
      ta.addEventListener('input', function(){ c.text = ta.value; save(); });
      row.querySelector('.del').addEventListener('click', function(){
        var idx = arr.indexOf(c); if(idx>-1) arr.splice(idx,1); save();
        var doc = frame.contentDocument; if(doc) renderPins(doc);
        renderList(); refreshCount();
      });
      row.querySelector('.jump').addEventListener('click', function(){
        var doc = frame.contentDocument; if(!doc) return;
        var pin = doc.querySelector('.__fbpin[data-id="'+c.id+'"]');
        if(pin) pin.scrollIntoView({behavior:'smooth',block:'center'});
      });
      listEl.appendChild(row);
    });
    if(focusNew && focusId){
      var nr = listEl.querySelector('.cmt[data-id="'+focusId+'"]');
      if(nr){ nr.scrollIntoView({block:'center'}); nr.querySelector('textarea').focus(); }
    }
  }

  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ===== Controls =====
  toggleBtn.addEventListener('click', function(){
    commenting = !commenting;
    toggleBtn.classList.toggle('on', commenting);
    toggleBtn.textContent = 'Comment Mode: ' + (commenting ? 'On' : 'Off');
    stage.classList.toggle('commenting', commenting);
  });
  pageSel.addEventListener('change', function(){ loadPage(pageSel.value); });
  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!pageComments(current).length) return;
    if(confirm('Delete all comments on '+label(current)+'?')){
      state[current] = []; save();
      var doc = frame.contentDocument; if(doc) renderPins(doc);
      renderList(); refreshCount();
    }
  });

  // ===== Export =====
  function buildMarkdown(){
    var out = '# Jonathan Sweat Preview Feedback\n\n';
    var any = false;
    PAGES.forEach(function(pg){
      var arr = state[pg[0]] || [];
      if(!arr.length) return;
      any = true;
      out += '## ' + pg[1] + '  (' + arr.length + ')\n\n';
      arr.forEach(function(c, i){
        var loc = c.ctx ? ' _(near: ' + c.ctx + ')_' : '';
        out += (i+1) + '. ' + (c.text.trim() || '[no text]') + loc + '\n';
      });
      out += '\n';
    });
    if(!any) out += '_No comments yet._\n';
    return out;
  }
  function openModal(){
    document.getElementById('exportText').value = buildMarkdown();
    document.getElementById('modal').classList.add('open');
  }
  document.getElementById('exportBtn').addEventListener('click', openModal);
  document.getElementById('exportBtn2').addEventListener('click', openModal);
  document.getElementById('modalClose').addEventListener('click', function(){ document.getElementById('modal').classList.remove('open'); });
  document.getElementById('copyBtn').addEventListener('click', function(){
    var ta = document.getElementById('exportText'); ta.select();
    navigator.clipboard.writeText(ta.value).then(function(){ var b=document.getElementById('copyBtn'); b.textContent='Copied ✓'; setTimeout(function(){b.textContent='Copy to clipboard';},1500); }).catch(function(){ document.execCommand('copy'); });
  });
  document.getElementById('downloadBtn').addEventListener('click', function(){
    var blob = new Blob([buildMarkdown()], {type:'text/markdown'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'jonathan-sweat-feedback.md'; a.click();
  });

  // init
  loadPage(current);
})();
</script>
</body>
</html>
