<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframes, The Hutson Group, Full Site</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#eceae6;--page:#fff;--box:#dedbd5;--box2:#e7e4df;--line:#b9b4ab;--ink:#2a2a28;--mut:#7a766e;--accent:#8d877a;--note:#b08968;--dark:#1d2024;--cmt:#3b6ea5;
 --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5}
/* top */
.top{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.top h1{font-size:14.5px;font-weight:600;letter-spacing:.04em}
.top h1 span{color:#bcb6aa;font-weight:500}
.top .meta{font-family:var(--mono);font-size:11px;color:#8f8b82}
.legend{font-family:var(--mono);font-size:11px;background:#15171a;color:#9a968d;padding:8px 26px;display:flex;gap:20px;flex-wrap:wrap}
.legend b{color:#bcb6aa}
/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 86px)}
.nav{background:#23262b;color:#cfccc4;padding:18px 0 60px;position:sticky;top:86px;height:calc(100vh - 86px);overflow:auto}
.nav .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f7177;padding:16px 22px 7px}
.nav button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:none;color:#cfccc4;text-align:left;padding:9px 22px;font-size:13.5px;cursor:pointer;font-family:var(--sans);transition:.15s;border-left:2px solid transparent}
.nav button:hover{background:#2b2f35;color:#fff}
.nav button.on{background:#2b2f35;color:#fff;border-left-color:#bcb6aa;font-weight:600}
.nav .cbadge{margin-left:auto;background:var(--cmt);color:#fff;font-family:var(--mono);font-size:10px;border-radius:10px;padding:1px 7px;display:none}
.nav .cbadge.show{display:inline-block}
/* canvas */
.canvas{padding:30px 30px 100px;max-width:1080px}
.pagelabel{font-family:var(--mono);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.pagefocus{font-family:var(--mono);font-size:11px;color:var(--note);margin-bottom:16px}
.frame{background:var(--page);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.06)}
.row{display:grid;grid-template-columns:1fr 270px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.blk{padding:22px 26px;border-right:1px dashed var(--line);position:relative}
.blkhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);padding:3px 9px;border-radius:3px;letter-spacing:.04em}
.blk h3{font-size:17px;font-weight:700;margin-bottom:5px}
.blk p{font-size:12.5px;color:var(--mut);max-width:540px}
.note{padding:22px 18px;font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.65;background:var(--box2)}
.note b{color:var(--note);font-weight:500}
/* comment button + pins */
.cbubble{background:none;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:5px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;transition:.15s}
.cbubble:hover{border-color:var(--cmt);color:var(--cmt)}
.cbubble svg{width:12px;height:12px}
.cbubble.has{background:var(--cmt);color:#fff;border-color:var(--cmt)}
/* sketch primitives */
.sk{margin-top:12px}
.bar{height:9px;background:var(--box);border-radius:3px}
.bar.h1{height:24px;width:66%;background:#cfcabf;margin-bottom:8px}
.bar.sub{height:10px;width:46%;background:#dedbd5;margin-bottom:12px}
.bar.line{width:100%;height:8px;margin-top:7px;background:#e3e0da}
.bar.line.s{width:78%}
.pills{display:flex;gap:10px;margin-top:6px}
.pill{height:28px;width:124px;background:var(--accent);border-radius:3px;opacity:.55}
.pill.ghost{background:transparent;border:1px solid var(--accent)}
.img{background:repeating-linear-gradient(45deg,#dedbd5,#dedbd5 8px,#e7e4df 8px,#e7e4df 16px);border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:#938e84}
.split{display:flex;gap:16px;align-items:stretch}
.split.alt{flex-direction:row-reverse}
.col{flex:1}
.imgbox{width:44%;min-height:120px}
.statbar{display:flex;gap:10px}
.stat{flex:1;background:var(--box2);border:1px solid var(--line);border-radius:3px;height:62px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:#938e84}
.cards{display:flex;gap:12px}
.card{flex:1;min-height:78px;background:var(--box2);border:1px solid var(--line);border-radius:3px;padding:11px}
.card .ic{width:24px;height:24px;background:var(--accent);opacity:.5;border-radius:5px;margin-bottom:8px}
.card .cl{height:7px;background:#dedbd5;border-radius:2px;margin-top:6px}
.card .cl.s{width:70%}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.gcell{aspect-ratio:1;background:var(--box2);border:1px solid var(--line);border-radius:50%}
.gcell.sq{border-radius:4px;aspect-ratio:4/3}
.steprow{display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid #ece9e4}
.steprow:first-child{border-top:none}
.steprow.alt{flex-direction:row-reverse;text-align:right}
.stepnum{font-family:var(--mono);font-size:18px;color:var(--accent);font-weight:600;width:32px;flex-shrink:0}
.stepimg{width:110px;height:48px;flex-shrink:0;background:repeating-linear-gradient(45deg,#dedbd5,#dedbd5 8px,#e7e4df 8px,#e7e4df 16px);border:1px solid var(--line);border-radius:3px}
.steptxt{flex:1}.steptxt b{font-size:13px}.steptxt span{display:block;font-size:11px;color:var(--mut)}
.faqline{height:32px;background:var(--box2);border:1px solid var(--line);border-radius:3px;margin-top:7px;display:flex;align-items:center;padding:0 11px;font-family:var(--mono);font-size:10.5px;color:var(--mut);justify-content:space-between}
.bigbox{min-height:120px}
.ctac{text-align:center;padding:8px 0}
.ctac .bar.h1{margin:0 auto 10px}.ctac .pills{justify-content:center}
.formrow{height:30px;background:#fff;border:1px solid var(--line);border-radius:3px;margin-top:8px;display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:10.5px;color:#a59f95}
.wfnav{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#23262b;color:#cfccc4;padding:11px 16px;border-radius:4px;flex-wrap:wrap}
.wfnav .logo{font-family:var(--mono);font-weight:600;font-size:12px;color:#bcb6aa;border:1px solid #4a4d52;padding:6px 10px;border-radius:3px}
.wfnav .navitems{display:flex;gap:18px;flex-wrap:wrap;flex:1;justify-content:center}
.wfnav .navitems span{font-size:12.5px;color:#cfccc4}
.wfnav .navcta{background:#bcb6aa;color:#23262b;border-radius:3px;padding:7px 16px;font-size:12px;font-weight:600}
/* composer modal */
.ov{position:fixed;inset:0;background:rgba(20,22,25,.55);z-index:50;display:none;place-items:center;padding:24px}
.ov.open{display:grid}
.composer{background:#fff;width:100%;max-width:480px;border-radius:6px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.composer .ch{background:var(--dark);color:#fff;padding:16px 20px}
.composer .ch .ctx{font-family:var(--mono);font-size:11px;color:#bcb6aa;margin-top:3px}
.composer .cb{padding:18px 20px}
.composer textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:4px;padding:11px;font-family:var(--sans);font-size:14px;resize:vertical}
.composer .cf{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:#fff}
.btn.pri{background:var(--cmt);color:#fff;border-color:var(--cmt)}
/* comments panel */
.cbtn{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--cmt);color:#fff;border:none;border-radius:30px;padding:13px 20px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 10px 30px rgba(59,110,165,.4);display:flex;align-items:center;gap:9px}
.cbtn svg{width:16px;height:16px}
.panel{position:fixed;top:0;right:0;height:100vh;width:380px;max-width:90vw;background:#fff;z-index:60;box-shadow:-10px 0 50px rgba(0,0,0,.25);transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel .ph{background:var(--dark);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.panel .ph h2{font-size:15px}
.panel .pbody{flex:1;overflow:auto;padding:14px 18px}
.panel .empty{color:var(--mut);font-size:13px;text-align:center;padding:40px 10px;font-family:var(--mono)}
.cgroup{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:16px 0 8px}
.citem{border:1px solid var(--line);border-radius:5px;padding:11px 12px;margin-bottom:9px;background:var(--box2)}
.citem .cmeta{font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:6px;display:flex;justify-content:space-between}
.citem .ctext{font-size:13px}
.citem .cdel{background:none;border:none;color:#b5524a;cursor:pointer;font-family:var(--mono);font-size:10px;margin-top:7px}
.panel .pf{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:8px;flex-wrap:wrap}
.panel .pf .btn{flex:1;text-align:center}
.x{background:none;border:none;color:#fff;cursor:pointer}.x svg{width:20px;height:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:820px){.shell{grid-template-columns:1fr}.nav{position:static;height:auto}.row{grid-template-columns:1fr}.blk{border-right:none}}
</style>
</head>

/* ---------------- SKETCH RENDER ---------------- */
function sketch(b){
 var s='<div class="sk">';
 switch(b.k){
  case 'hero': s+='<div class="bar h1"></div><div class="bar sub"></div><div class="pills"><span class="pill"></span><span class="pill ghost"></span></div>';break;
  case 'statbar': s+='<div class="statbar"><div class="stat">$200M+</div><div class="stat">750+</div><div class="stat">Top 1%</div><div class="stat">1,200+</div></div>';break;
  case 'map': s+='<div class="split"><div class="img imgbox bigbox" style="width:58%">COUNTY MAP</div><div class="col"><div class="bar h1" style="width:80%;height:18px"></div><div class="bar line"></div><div class="bar line s"></div></div></div>';break;
  case 'bands': s+='<div class="img" style="min-height:54px;margin-bottom:8px">BUY (content left)</div><div class="img" style="min-height:54px">SELL (content right)</div>';break;
  case 'split': s+='<div class="split '+(b.alt?'alt':'')+'"><div class="col"><div class="bar h1" style="height:18px"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line s"></div></div><div class="img imgbox">IMG</div></div>';break;
  case 'cards': {var n=b.n||3;s+='<div class="cards">';for(var i=0;i<n;i++)s+='<div class="card"><div class="ic"></div><div class="cl"></div><div class="cl s"></div></div>';s+='</div>';}break;
  case 'grid': {var n=b.n||6;s+='<div class="grid">';for(var i=0;i<n;i++)s+='<div class="gcell"></div>';s+='</div>';}break;
  case 'steps': {s+='';b.steps.forEach(function(st,i){s+='<div class="steprow '+(i%2?'alt':'')+'"><div class="stepnum">'+String(i+1).padStart(2,'0')+'</div><div class="stepimg"></div><div class="steptxt"><b>'+st+'</b><span>step detail</span></div></div>';});}break;
  case 'quote': s+='<div class="bar line" style="width:90%;height:14px"></div><div class="bar line" style="width:75%;height:14px"></div><div class="bar line s" style="margin-top:12px;width:30%"></div>';break;
  case 'faq': s+='<div class="faqline">Q · question one <span>+</span></div><div class="faqline">Q · question two <span>+</span></div><div class="faqline">Q · question three <span>+</span></div><div style="font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:7px">(6 total)</div>';break;
  case 'cta': s+='<div class="ctac"><div class="bar h1" style="width:50%"></div><div class="pills"><span class="pill"></span><span class="pill ghost"></span></div></div>';break;
  case 'form': s+='<div class="split"><div class="col"><div class="formrow">Name</div><div class="formrow">Email</div><div class="formrow">Message</div><div class="pills"><span class="pill" style="margin-top:8px"></span></div></div><div class="col"><div class="bar line"></div><div class="bar line s"></div></div></div>';break;
  case 'widget': s+='<div class="split"><div class="col"><div class="formrow">Property address</div><div class="pills"><span class="pill" style="margin-top:8px"></span></div></div><div class="img imgbox">WIDGET</div></div>';break;
  case 'idx': s+='<div class="img bigbox" style="min-height:150px">SHOWCASE IDX</div>';break;
  case 'legal': s+='<div class="bar line"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line s"></div><div class="bar line"></div><div class="bar line"></div><div class="bar line s"></div>';break;
  case 'header': s+='<div class="wfnav"><span class="logo">THG</span><div class="navitems"><span>Search Homes</span><span>Communities</span><span>Buy &#9662;</span><span>Sell &#9662;</span><span>Programs &#9662;</span><span>About &#9662;</span></div><span class="navcta">Contact</span></div>';break;
  case 'footer': s+='<div class="img" style="min-height:50px;background:#23262b;color:#9a968d;border-color:#23262b">FOOTER · 4 columns</div>';break;
  default: s+='<div class="bar line"></div>';
 }
 return s+'</div>';
}

/* ---------------- COMMENTS ---------------- */
var KEY='thg_wf_comments_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function countFor(page,tag){return load().filter(function(c){return c.page===page&&c.tag===tag;}).length;}

var current='home';
function render(key){
 current=key;
 var p=PAGES.filter(function(x){return x.key===key;})[0];
 var h='<div class="pagelabel">'+p.label+'</div><div class="pagefocus">focus keyword: "'+p.focus+'"</div><div class="frame">';
 [HEADER].concat(p.blocks).forEach(function(b,i){
  var has=countFor(key,b.tag);
  h+='<div class="row"><div class="blk"><div class="blkhead"><span class="tag">'+b.tag+'</span>'+
   '<button class="cbubble'+(has?' has':'')+'" data-tag="'+b.tag.replace(/"/g,'')+'" data-title="'+b.t.replace(/"/g,'&quot;')+'">'+
   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+(has?has:'Comment')+'</button></div>'+
   '<h3>'+b.t+'</h3><p>'+b.d+'</p>'+sketch(b)+'</div><div class="note">'+b.note+'</div></div>';
 });
 h+='</div>';
 document.getElementById('canvas').innerHTML=h;
 document.querySelectorAll('#nav button').forEach(function(x){x.classList.toggle('on',x.dataset.k===key);});
 document.querySelectorAll('.cbubble').forEach(function(btn){
  btn.addEventListener('click',function(){openComposer(key,btn.dataset.tag,btn.dataset.title);});
 });
 window.scrollTo(0,0);
}

/* nav */
(function buildNav(){
 var groups=['Core','Programs','Utility'];var nav=document.getElementById('nav');var h='';
 groups.forEach(function(g){
  h+='<div class="grp">'+g+'</div>';
  PAGES.filter(function(p){return p.grp===g;}).forEach(function(p){
   h+='<button data-k="'+p.key+'">'+p.label+'<span class="cbadge" data-badge="'+p.key+'"></span></button>';
  });
 });
 nav.innerHTML=h;
 nav.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){render(b.dataset.k);});});
})();

/* composer */
var pending=null;
function openComposer(page,tag,title){
 pending={page:page,tag:tag,title:title};
 document.getElementById('cctx').textContent=PAGES.filter(function(x){return x.key===page;})[0].label+' · '+tag;
 document.getElementById('ctext').value='';
 document.getElementById('ov').classList.add('open');
 setTimeout(function(){document.getElementById('ctext').focus();},50);
}
function closeComposer(){document.getElementById('ov').classList.remove('open');pending=null;}
document.getElementById('ccancel').addEventListener('click',closeComposer);
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)closeComposer();});
document.getElementById('csave').addEventListener('click',function(){
 var t=document.getElementById('ctext').value.trim();if(!t||!pending)return;
 var a=load();a.push({page:pending.page,tag:pending.tag,title:pending.title,text:t,ts:Date.now()});save(a);
 closeComposer();render(current);refreshBadges();updateCount();toast('Comment saved');
});

/* badges + count */
function refreshBadges(){
 var a=load();
 document.querySelectorAll('.cbadge').forEach(function(b){
  var n=a.filter(function(c){return c.page===b.dataset.badge;}).length;
  b.textContent=n;b.classList.toggle('show',n>0);
 });
}
function updateCount(){document.getElementById('ccount').textContent=load().length;}

/* panel */
function openPanel(){renderPanel();document.getElementById('panel').classList.add('open');}
document.getElementById('cbtn').addEventListener('click',openPanel);
document.getElementById('pclose').addEventListener('click',function(){document.getElementById('panel').classList.remove('open');});
function labelFor(k){return PAGES.filter(function(p){return p.key===k;})[0].label;}
function renderPanel(){
 var a=load();var body=document.getElementById('pbody');
 if(!a.length){body.innerHTML='<div class="empty">No comments yet.<br>Click the comment button on any block.</div>';return;}
 var byPage={};a.forEach(function(c,i){c._i=i;(byPage[c.page]=byPage[c.page]||[]).push(c);});
 var h='';
 PAGES.forEach(function(p){
  if(!byPage[p.key])return;
  h+='<div class="cgroup">'+p.label+'</div>';
  byPage[p.key].forEach(function(c){
   h+='<div class="citem"><div class="cmeta"><span>'+c.tag+'</span></div><div class="ctext">'+esc(c.text)+'</div><button class="cdel" data-i="'+c._i+'">Delete</button></div>';
  });
 });
 body.innerHTML=h;
 body.querySelectorAll('.cdel').forEach(function(btn){btn.addEventListener('click',function(){
  var a=load();a.splice(+btn.dataset.i,1);save(a);renderPanel();render(current);refreshBadges();updateCount();
 });});
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* export */
function toMarkdown(){
 var a=load();if(!a.length)return '';
 var byPage={};a.forEach(function(c){(byPage[c.page]=byPage[c.page]||[]).push(c);});
 var out='# The Hutson Group, Wireframe Comments\n\n';
 PAGES.forEach(function(p){
  if(!byPage[p.key])return;
  out+='## '+p.label+'\n';
  byPage[p.key].forEach(function(c){out+='- ['+c.tag+'] '+c.text+'\n';});
  out+='\n';
 });
 return out;
}
document.getElementById('copyall').addEventListener('click',function(){
 var md=toMarkdown();if(!md){toast('No comments to copy');return;}
 navigator.clipboard.writeText(md).then(function(){toast('Copied. Paste it back to Claude.');},function(){
  var ta=document.createElement('textarea');ta.value=md;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied.');
 });
});
document.getElementById('download').addEventListener('click',function(){
 var md=toMarkdown();if(!md){toast('No comments');return;}
 var b=new Blob([md],{type:'text/markdown'});var u=URL.createObjectURL(b);var a=document.createElement('a');
 a.href=u;a.download='hutson-wireframe-comments.md';a.click();URL.revokeObjectURL(u);toast('Downloaded');
});
document.getElementById('clearall').addEventListener('click',function(){
 if(!load().length)return;
 if(confirm('Delete all comments?')){save([]);renderPanel();render(current);refreshBadges();updateCount();}
});

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

/* init */
render('home');refreshBadges();updateCount();
</script>
