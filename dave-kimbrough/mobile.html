<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile view · Dave Kimbrough</title>
<style>
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;background:#181818;color:#ddd}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;position:sticky;top:0;background:#181818;z-index:2;border-bottom:1px solid #2a2a2a}
h1{font-size:15px;font-weight:600;margin:0}
h1 small{color:#888;font-weight:400}
.w{display:flex;gap:4px;margin-left:auto}
.w button{font:inherit;font-size:12px;padding:6px 12px;border-radius:5px;border:1px solid #3a3a3a;background:transparent;color:#ccc;cursor:pointer}
.w button.on{background:#c9a35a;border-color:#c9a35a;color:#161616}
.row{display:flex;gap:24px;overflow-x:auto;padding:22px;align-items:flex-start}
figure{margin:0;flex:0 0 auto}
figcaption{display:flex;justify-content:space-between;gap:10px;padding:0 2px 8px;color:#aaa}
figcaption a{color:#7ab8ff;text-decoration:none}
iframe{border:0;background:#fff;width:var(--fw,375px);height:74vh;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.5)}
.single .row{justify-content:center}
.single iframe{height:84vh}
</style>
</head>
<body>
<header>
  <h1>Dave Kimbrough <small>· mobile view · the same live pages at phone width</small></h1>
  <span class="w"><button data-w="375px" class="on">375</button><button data-w="768px">768</button></span>
</header>
<div class="row" id="row"></div>
<script>
var PAGES = [["01-home.html", "Home"], ["02-about.html", "About"], ["03-meet-the-team.html", "Meet the Team"], ["04-testimonials.html", "Testimonials"], ["05-buyers-guide.html", "Buyers Guide"], ["06-sellers-guide.html", "Sellers Guide"], ["07-home-valuation.html", "Home Valuation"], ["08-communities.html", "Communities"], ["09-home-search.html", "Home Search"], ["10-featured-listings.html", "Featured Listings"], ["11-sold-listings.html", "Sold Listings"], ["12-blog.html", "Blog"], ["13-contact.html", "Contact"], ["14-homes-for-sale-mesa-county-co.html", "Homes For Sale Mesa County Co"], ["15-homes-for-sale-redlands-grand-junction-co.html", "Homes For Sale Redlands Grand Junction Co"], ["16-homes-for-sale-grand-junction-co.html", "Homes For Sale Grand Junction Co"], ["17-homes-for-sale-fruita-co.html", "Homes For Sale Fruita Co"], ["18-homes-for-sale-palisade-co.html", "Homes For Sale Palisade Co"], ["19-homes-for-sale-orchard-mesa-co.html", "Homes For Sale Orchard Mesa Co"], ["20-homes-for-sale-loma-co.html", "Community: Homes For Sale Loma Co"], ["21-homes-for-sale-mack-co.html", "Community: Homes For Sale Mack Co"], ["22-homes-for-sale-whitewater-co.html", "Community: Homes For Sale Whitewater Co"], ["23-homes-for-sale-clifton-co.html", "Community: Homes For Sale Clifton Co"], ["24-land-for-sale-grand-junction-co.html", "Community: Land For Sale Grand Junction Co"], ["25-condos-townhomes-grand-junction-co.html", "Community: Condos Townhomes Grand Junction Co"], ["26-sitemap.html", "Community: Sitemap"], ["27-privacy-policy.html", "Community: Privacy Policy"], ["28-terms-of-use.html", "Community: Terms Of Use"], ["29-mls-disclaimer.html", "Community: Mls Disclaimer"], ["30-accessibility-statement.html", "Community: Accessibility Statement"]];
var q = new URLSearchParams(location.search).get("page");
var list = q ? PAGES.filter(function(p){ return p[0] === q; }) : PAGES;
if (q) document.body.classList.add("single");
var row = document.getElementById("row");
list.forEach(function(p){
  var f = document.createElement("figure");
  f.innerHTML = '<figcaption><span>' + p[1] + '</span>' +
    '<a href="' + p[0] + '">open full page</a></figcaption>' +
    '<iframe loading="lazy" src="' + p[0] + '" title="' + p[1] + '"></iframe>';
  row.appendChild(f);
});
document.querySelectorAll(".w button").forEach(function(b){
  b.addEventListener("click", function(){
    document.documentElement.style.setProperty("--fw", b.dataset.w);
    document.querySelectorAll(".w button").forEach(function(o){
      o.classList.toggle("on", o === b); });
  });
});
</script>
</body>
</html>
