<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile view · Garrett Simon</title>
<style>
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;background:#181818;color:#ddd}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;position:sticky;top:0;background:#181818;z-index:2;border-bottom:1px solid #2a2a2a}
h1{font-size:15px;font-weight:600;margin:0}
h1 small{color:#888;font-weight:400}
.w{display:flex;gap:4px;margin-left:auto}
.w button{font:inherit;font-size:12px;padding:6px 12px;border-radius:5px;border:1px solid #3a3a3a;background:transparent;color:#ccc;cursor:pointer}
.w button.on{background:#c9a35a;border-color:#c9a35a;color:#161616}
.row{display:flex;gap:24px;overflow-x:auto;padding:22px;align-items:flex-start}
figure{margin:0;flex:0 0 auto}
figcaption{display:flex;justify-content:space-between;gap:10px;padding:0 2px 8px;color:#aaa}
figcaption a{color:#7ab8ff;text-decoration:none}
iframe{border:0;background:#fff;width:var(--fw,375px);height:74vh;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 14px 40px rgba(0,0,0,.5)}
.single .row{justify-content:center}
.single iframe{height:84vh}
</style>
</head>
<body>
<header>
  <h1>Garrett Simon <small>· mobile view · the same live pages at phone width</small></h1>
  <span class="w"><button data-w="375px" class="on">375</button><button data-w="768px">768</button></span>
</header>
<div class="row" id="row"></div>
<script>
var PAGES = [["01-home.html", "Home"], ["02-about.html", "About"], ["03-testimonials.html", "Testimonials"], ["04-blog.html", "Blog"], ["05-communities.html", "Communities"], ["06-home-value.html", "Home Value"], ["07-buyers-guide.html", "Buyers Guide"], ["08-why-sell-with-us.html", "Why Sell With Us"], ["09-sellers-guide.html", "Sellers Guide"], ["10-contact.html", "Contact"], ["11-home-search.html", "Home Search"], ["12-featured-listings.html", "Featured Listings"], ["13-homes-for-sale-telluride-co.html", "Homes For Sale Telluride Co"], ["14-homes-for-sale-mountain-village-co.html", "Homes For Sale Mountain Village Co"], ["15-homes-for-sale-deep-creek-mesa.html", "Homes For Sale Deep Creek Mesa"], ["16-homes-for-sale-turkey-creek-mesa.html", "Homes For Sale Turkey Creek Mesa"], ["17-homes-for-sale-wilson-mesa.html", "Homes For Sale Wilson Mesa"], ["18-homes-for-sale-hastings-mesa.html", "Homes For Sale Hastings Mesa"], ["19-homes-for-sale-iron-springs-mesa.html", "Homes For Sale Iron Springs Mesa"], ["20-homes-for-sale-placerville-co.html", "Community: Homes For Sale Placerville Co"], ["21-homes-for-sale-specie-mesa.html", "Community: Homes For Sale Specie Mesa"], ["22-homes-for-sale-ophir-co.html", "Community: Homes For Sale Ophir Co"], ["23-things-to-do.html", "Community: Things To Do"], ["24-dining.html", "Community: Dining"], ["25-concierge.html", "Community: Concierge"], ["26-luxury-rentals.html", "Community: Luxury Rentals"], ["27-market-reports.html", "Community: Market Reports"], ["28-sitemap.html", "Community: Sitemap"], ["29-privacy-policy.html", "Community: Privacy Policy"], ["30-terms-of-use.html", "Community: Terms Of Use"], ["31-mls-disclaimer.html", "Community: Mls Disclaimer"], ["32-blog-post.html", "Community: Blog Post"]];
var q = new URLSearchParams(location.search).get("page");
var list = q ? PAGES.filter(function(p){ return p[0] === q; }) : PAGES;
if (q) document.body.classList.add("single");
var row = document.getElementById("row");
list.forEach(function(p){
  var f = document.createElement("figure");
  f.innerHTML = '<figcaption><span>' + p[1] + '</span>' +
    '<a href="' + p[0] + '">open full page</a></figcaption>' +
    '<iframe loading="lazy" src="' + p[0] + '" title="' + p[1] + '"></iframe>';
  row.appendChild(f);
});
document.querySelectorAll(".w button").forEach(function(b){
  b.addEventListener("click", function(){
    document.documentElement.style.setProperty("--fw", b.dataset.w);
    document.querySelectorAll(".w button").forEach(function(o){
      o.classList.toggle("on", o === b); });
  });
});
</script>
</body>
</html>
