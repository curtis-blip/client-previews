<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stephanie Sills v2 · Website Mockups</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .pi { padding: clamp(40px, 5vw, 80px) 0 120px; }
  .pi__top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px; padding-bottom: 40px; border-bottom: 1px solid var(--line); }
  .pi__top img { height: 64px; width: auto; }
  .pi__top h1 { font-size: clamp(34px, 4vw, 58px); margin-top: 28px; }
  .pi__top p { margin: 10px 0 0; color: var(--stone); }
  .pi__group { margin-top: 64px; }
  .pi__group h2 { font-size: 13px; font-weight: 600; letter-spacing: .28em; color: var(--stone); margin-bottom: 22px; }
  .pi__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 26px 20px; }
  .pi__thumb { display: grid; place-items: center; aspect-ratio: 16 / 10; background: var(--mist); overflow: hidden; text-decoration: none; }
  .pi__thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 900ms var(--ease); }
  .pi__card:hover .pi__thumb img { transform: scale(1.04); }
  .pi__type { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--stone); }
  .pi__meta { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin-top: 12px; }
  .pi__name { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
  .pi__path { grid-column: 1; font-size: 13px; color: var(--stone); }
  .pi__m { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .14em; color: var(--ink); border: 1px solid var(--line); padding: 8px 10px; text-decoration: none; }
  .pi__m:hover { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
<main class="pi">
  <div class="wrap">
    <header class="pi__top">
      <div>
        <img src="assets/logo-palermo-black.png" alt="Palermo Properties Team">
        <h1>Website mockups</h1>
        <p>v2 · 2 pages so far · stephaniesillsrealty.com · October 2026</p>
      </div>
      <div class="acts">
        <a class="btn" href="01-home.html">Open the home page</a>
        <a class="btn" href="mobile.html">View every page on mobile</a>
      </div>
    </header>
  <section class="pi__group">
    <h2>The front door</h2>
    <ul class="pi__grid">
      <li class="pi__card">
        <a class="pi__thumb" href="01-home.html"><img src="assets/hero-hmb-cove.jpg" alt="" loading="lazy"></a>
        <div class="pi__meta">
          <a class="pi__name" href="01-home.html">Home</a>
          <span class="pi__path">/</span>
          <a class="pi__m" href="mobile.html?page=01-home.html">375</a>
        </div>
      </li>
    </ul>
  </section>
  <section class="pi__group">
    <h2>Sell</h2>
    <ul class="pi__grid">
      <li class="pi__card">
        <a class="pi__thumb" href="07-compass-concierge.html"><img src="assets/rb-living-sunset.jpg" alt="" loading="lazy"></a>
        <div class="pi__meta">
          <a class="pi__name" href="07-compass-concierge.html">Compass Concierge</a>
          <span class="pi__path">/compass-concierge-half-moon-bay/</span>
          <a class="pi__m" href="mobile.html?page=07-compass-concierge.html">375</a>
        </div>
      </li>
    </ul>
  </section>
  </div>
</main>
</body>
</html>
