<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIREFRAME, Map Hover Lift, The Hutson Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0e0e;
    --pewter:#bcb6aa;
    --pewter-dark:#8d877a;
    --paper:#f6f5f2;
    --paper-2:#eceae4;
    --ink-on-paper:#181a1c;
    --line:rgba(188,182,170,.22);
    --display:'Montserrat',sans-serif;
    --body:'Inter',sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:smooth}

  body{
    font-family:var(--body);
    color:var(--ink-on-paper);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  /* Fixed wireframe label, top-left */
  .wf-flag{
    position:fixed;
    top:14px;
    left:14px;
    z-index:50;
    background:var(--ink);
    color:var(--pewter);
    font-family:var(--display);
    font-weight:600;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }

  /* Map section on light paper */
  .map-section{
    background:var(--paper);
    padding:120px 24px 110px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  .map-head{
    text-align:center;
    max-width:680px;
    margin:0 auto 44px;
  }

  .eyebrow{
    font-family:var(--display);
    font-weight:600;
    font-size:13px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--pewter-dark);
    margin-bottom:16px;
  }

  .map-head h2{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(28px,4.5vw,38px);
    line-height:1.1;
    color:var(--ink);
    letter-spacing:-.01em;
    margin-bottom:16px;
  }

  .map-head p{
    font-size:16px;
    color:#54565a;
    max-width:520px;
    margin:0 auto;
  }

  .map-wrap{
    width:100%;
    max-width:720px;
    margin:0 auto;
  }

  /* The map sits in its own padded stage so a lifted edge county
     never clips against the section edge. overflow:visible lets the
     drop-shadow + transform spill outside the SVG box cleanly. */
  #countyMap{
    width:100%;
    height:auto;
    overflow:visible;
    display:block;
  }

  /* ===== HOVER LIFT, the core of this wireframe ===== */
  .county{
    fill:var(--ink);
    stroke:var(--paper);
    stroke-width:3;
    cursor:pointer;
    transition:
      transform .25s cubic-bezier(.2,.8,.2,1),
      fill .25s ease,
      filter .25s ease;
    transform-box:fill-box;
    transform-origin:center;
  }

  .county:hover{
    fill:var(--pewter);
    transform:translateY(-10px) scale(1.04);
    filter:drop-shadow(0 12px 14px rgba(0,0,0,.55));
  }

  /* County labels, kept legible and above the paths */
  .county-label{
    font-family:var(--display);
    font-weight:600;
    font-size:21px;
    fill:#fff;
    pointer-events:none;
    text-anchor:middle;
    letter-spacing:.01em;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    transform-box:fill-box;
    transform-origin:center;
  }
  /* When its county is lifted, nudge the matching label up to match.
     JS toggles .is-lifted on the label of the hovered county. */
  .county-label.is-lifted{
    transform:translateY(-10px);
  }
</style>
</head>

<script>
  // Bring-to-front on hover so the lifted county paints ABOVE its
  // neighbors (SVG paint order = document order). Re-append the path
  // to the end of its parent <g class="counties"> on mouseenter.
  // The labels <g> stays AFTER the counties <g>, so labels remain
  // on top and readable. We also nudge the matching label up to keep
  // it visually attached to the lifted county.
  (function(){
    var counties = document.querySelectorAll('#countyMap .county');
    var labelByName = {};
    document.querySelectorAll('#countyMap .county-label').forEach(function(t){
      labelByName[t.getAttribute('data-label')] = t;
    });

    counties.forEach(function(path){
      path.addEventListener('mouseenter', function(){
        var name = path.getAttribute('data-c');
        var group = path.parentNode;        // <g class="counties">
        group.appendChild(path);            // repaint this county on top
        var label = labelByName[name];
        if(label){ label.classList.add('is-lifted'); }
      });
      path.addEventListener('mouseleave', function(){
        var name = path.getAttribute('data-c');
        var label = labelByName[name];
        if(label){ label.classList.remove('is-lifted'); }
      });
    });
  })();
</script>
